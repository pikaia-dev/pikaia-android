jdk:
  - openjdk17
before_install:
  - ./gradlew clean
install:
  # JitPack sets $VERSION to the requested tag; the modules publish under it so the
  # rewritten com.github coordinates resolve consistently.
  - ./gradlew :sdk-bom:publishToMavenLocal -Ppikaia.sdk.version=$VERSION
  - ./gradlew :sdk-core:publishToMavenLocal -Ppikaia.sdk.version=$VERSION
  - ./gradlew :sdk-auth:publishToMavenLocal -Ppikaia.sdk.version=$VERSION
  - ./gradlew :sdk-sync:publishToMavenLocal -Ppikaia.sdk.version=$VERSION
